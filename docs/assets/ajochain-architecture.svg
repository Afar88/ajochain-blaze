<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">AjoChain BLAZE architecture</title>
  <desc id="desc">Members use Selene through WizardConnect to interact with the browser application. Read-only chain readers and the PUSD verification API query Electrum providers. Bitcoin Cash on-chain transactions and covenant outputs remain the source of truth. Local drafts are not chain records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10283a"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#134e4a"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172f54"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#503b18"/><stop offset="1" stop-color="#92400e"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="3" refY="5" orient="auto"><path d="M10 0L0 5L10 10z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#5eead4">SYSTEM MAP</text>
  <text x="72" y="116" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#f8fafc">AjoChain BLAZE architecture</text>
  <text x="72" y="151" font-family="Inter,Arial,sans-serif" font-size="17" fill="#9fb3c8">Wallet-controlled actions. Read-only verification. Blockchain-backed circle state.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="64" y="205" width="330" height="266" rx="22" fill="#0d1b2b" stroke="#5eead4" stroke-width="2"/>
    <circle cx="111" cy="257" r="23" fill="#123b42" stroke="#5eead4" stroke-width="2"/>
    <path d="M101 257h20M111 247v20" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
    <text x="150" y="264" font-size="23" font-weight="800" fill="#f8fafc">Member + wallet</text>
    <text x="92" y="316" font-size="17" font-weight="700" fill="#99f6e4">Selene · WizardConnect</text>
    <text x="92" y="351" font-size="15" fill="#cbd5e1">• Wallet holds the keys</text>
    <text x="92" y="382" font-size="15" fill="#cbd5e1">• Explicit transaction approval</text>
    <text x="92" y="413" font-size="15" fill="#cbd5e1">• Network/address confirmation</text>
    <text x="92" y="447" font-size="13" fill="#94a3b8">A connection is not a payment.</text>

    <rect x="445" y="205" width="495" height="266" rx="22" fill="#0d1b2b" stroke="#60a5fa" stroke-width="2"/>
    <rect x="480" y="232" width="44" height="44" rx="12" fill="#172f54" stroke="#60a5fa"/>
    <path d="M491 246h22M491 254h22M491 262h15" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"/>
    <text x="545" y="262" font-size="23" font-weight="800" fill="#f8fafc">BLAZE web application</text>
    <text x="480" y="316" font-size="17" font-weight="700" fill="#bfdbfe">React · TypeScript · Vite</text>
    <text x="480" y="351" font-size="15" fill="#cbd5e1">• BCH and PUSD circle workspaces</text>
    <text x="480" y="382" font-size="15" fill="#cbd5e1">• Transaction previews and wallet intents</text>
    <text x="480" y="413" font-size="15" fill="#cbd5e1">• Activity and member-accounting views</text>
    <text x="480" y="447" font-size="13" fill="#94a3b8">Browser drafts are local convenience data.</text>

    <rect x="991" y="205" width="385" height="266" rx="22" fill="#0d1b2b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="1038" cy="255" r="22" fill="#503b18" stroke="#fbbf24" stroke-width="2"/>
    <path d="M1027 255h22M1038 244v22" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
    <text x="1077" y="262" font-size="23" font-weight="800" fill="#f8fafc">Read / verify layer</text>
    <text x="1025" y="316" font-size="16" font-weight="700" fill="#fde68a">Electrum quorum · Vercel API</text>
    <text x="1025" y="351" font-size="14" fill="#cbd5e1">• Raw prevout and txid checks</text>
    <text x="1025" y="381" font-size="14" fill="#cbd5e1">• Circle / receipt / escrow validation</text>
    <text x="1025" y="411" font-size="14" fill="#cbd5e1">• PUSD signed-byte + BCH VM checks</text>
    <text x="1025" y="447" font-size="13" fill="#94a3b8">No relay or broadcast in the PUSD verifier.</text>

    <path d="M397 335H438" stroke="#7dd3fc" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
    <text x="417" y="315" text-anchor="middle" font-size="11" fill="#bae6fd">pair / approve</text>
    <path d="M943 335H984" stroke="#7dd3fc" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
    <text x="964" y="315" text-anchor="middle" font-size="11" fill="#bae6fd">read / verify</text>

    <rect x="171" y="558" width="1098" height="132" rx="22" fill="url(#teal)" stroke="#5eead4" stroke-width="2"/>
    <g transform="translate(215 588)">
      <circle cx="29" cy="29" r="24" fill="#0b2b2b" stroke="#99f6e4" stroke-width="2"/>
      <path d="M29 9l15 8v20l-15 8-15-8V17z" fill="none" stroke="#99f6e4" stroke-width="2"/>
      <path d="M29 17v20M20 22h18M20 30h18" stroke="#99f6e4" stroke-width="2"/>
    </g>
    <text x="290" y="610" font-size="25" font-weight="800" fill="#f0fdfa">Bitcoin Cash blockchain</text>
    <text x="290" y="644" font-size="16" fill="#ccfbf1">Transactions · CashTokens · covenant state · member receipts · UTXOs</text>
    <text x="290" y="671" font-size="13" fill="#99f6e4">The chain is the source of truth for on-chain identity and spend state.</text>
    <path d="M1183 474V520H1183V549" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1203" y="526" font-size="12" fill="#bae6fd">query / reconcile</text>
    <path d="M690 474V520H690V549" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="710" y="526" font-size="12" fill="#bae6fd">discover / inspect</text>
  </g>
  <text x="72" y="728" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8">Provider quorum is not local SPV/chainwork validation; operator independence still needs independent evidence.</text>
</svg>