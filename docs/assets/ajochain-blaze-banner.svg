  <g font-family="Inter,Arial,sans-serif">
    <text x="82" y="84" font-size="18" font-weight="700" letter-spacing="5" fill="#5eead4">BITCOIN CASH · NON-CUSTODIAL</text>
    <text x="78" y="171" font-size="76" font-weight="800" letter-spacing="-3" fill="#f8fafc">AJOCHAIN</text>
    <text x="82" y="236" font-size="52" font-weight="800" letter-spacing="9" fill="url(#gold)">BLAZE</text>
    <text x="84" y="292" font-size="22" fill="#cbd5e1">Rotating savings circles with member-owned credit</text>
    <text x="84" y="326" font-size="15" fill="#94a3b8">On-chain rules · Wallet-controlled signing · Transparent round accounting</text>
