<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">AjoChain BLAZE — Bitcoin Cash savings circles</title>
  <desc id="desc">A dark navy banner with a linked-circle mark representing members, shared contributions, and transparent on-chain settlement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".58" stop-color="#10243a"/>
      <stop offset="1" stop-color="#123f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1190" cy="170" r="180" fill="#2dd4bf" opacity=".07"/>
  <circle cx="1280" cy="250" r="110" fill="#60a5fa" opacity=".07"/>
  <path d="M0 300 C260 235 400 390 660 300 S1050 215 1440 300" fill="none" stroke="#7dd3fc" stroke-opacity=".11" stroke-width="2"/>
  <g transform="translate(1020 38)" filter="url(#glow)">
    <circle cx="165" cy="142" r="96" fill="none" stroke="url(#accent)" stroke-width="5" stroke-dasharray="5 12" opacity=".9"/>
    <circle cx="165" cy="142" r="61" fill="#0b1b2c" stroke="#5eead4" stroke-width="2"/>
    <path d="M137 142h56M165 114v56" stroke="#5eead4" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0c2333" stroke="url(#accent)" stroke-width="4">
      <circle cx="165" cy="26" r="29"/>
      <circle cx="265" cy="84" r="29"/>
      <circle cx="265" cy="200" r="29"/>
      <circle cx="165" cy="258" r="29"/>
      <circle cx="65" cy="200" r="29"/>
      <circle cx="65" cy="84" r="29"/>
    </g>
    <g fill="#dbeafe">
      <circle cx="165" cy="26" r="7"/><circle cx="265" cy="84" r="7"/>
      <circle cx="265" cy="200" r="7"/><circle cx="165" cy="258" r="7"/>
      <circle cx="65" cy="200" r="7"/><circle cx="65" cy="84" r="7"/>
    </g>
