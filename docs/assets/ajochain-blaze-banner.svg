    <rect x="242" y="3" width="82" height="30" rx="15" fill="#123b42" stroke="#5eead4" stroke-opacity=".65"/>
    <text x="283" y="23" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#99f6e4" text-anchor="middle">BCH</text>
    <rect x="5" y="250" width="90" height="30" rx="15" fill="#3b2c14" stroke="#fbbf24" stroke-opacity=".7"/>
    <text x="50" y="270" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#fde68a" text-anchor="middle">PUSD</text>
