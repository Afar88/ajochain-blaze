name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "build/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (!counts) {
              console.error("npm audit did not return a valid vulnerability summary; failing closed.");
              process.exit(1);
            }
            console.log("Dependency audit summary:", JSON.stringify(counts));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === "string" ? v : { title: v.title, url: v.url, range: v.range }) }));
            }
            const blocking = Number(counts.high ?? 0) + Number(counts.critical ?? 0);
            if (blocking > 0) {
              console.error("CI blocked: high/critical dependency vulnerabilities were found.");
              process.exit(1);
            }
          '
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  bch-2026-vmb:
    name: BCH 2026 consensus vectors (targeted upstream suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLAZE
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Libauth VMB fixtures
        uses: actions/checkout@v7.0.1
        with:
          repository: bitauth/libauth
          ref: d28da7f595cbd747c1e1125477db655f740f3dbc
          path: .ci/libauth
          persist-credentials: false
          sparse-checkout: |
            src/lib/vmb-tests/generated/bch_2026_standard/chip.bitwise.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_standard/chip.functions.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_standard/chip.loops.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_standard/chip.p2s.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_standard/chip.flow-control.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_nonstandard/chip.bitwise.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_invalid/chip.bitwise.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_invalid/chip.functions.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_invalid/chip.loops.vmb_tests.json
            src/lib/vmb-tests/generated/bch_2026_invalid/chip.flow-control.vmb_tests.json
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install the exact Libauth verifier
        run: npm install --prefix .ci --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @bitauth/libauth@3.1.0-next.8
      - name: Verify BCH 2026 upstream vectors
        run: node .ci/verify-bch-2026-vmb.mjs .ci/libauth/src/lib/vmb-tests/generated
      - name: Smoke-test full-corpus discovery on the sparse fixture set
        run: node .ci/verify-bch-2026-vmb.mjs .ci/libauth/src/lib/vmb-tests/generated --full
